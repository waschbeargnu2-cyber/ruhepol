# ERKLÄRUNG: Cloud-Build
# Bei jedem Hochladen (push) auf den Branch "main" baut GitHub hier
# automatisch die Android-App (APK) und hängt sie an ein "Release" an.
# Dort lädst du sie auf dem Handy herunter und installierst sie.
name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projektdateien erzeugen (nur beim ersten Build)
        id: bootstrap
        run: |
          if [ ! -d android ]; then
            flutter create --org app.ruhepol --project-name ruhepol --platforms android .
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pakete laden
        run: flutter pub get

      - name: Code prüfen
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      # Immer derselbe Schlüssel => Updates lassen sich über die alte
      # Version installieren, ohne dass deine Daten verloren gehen.
      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_B64: ${{ secrets.RUHEPOL_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Das Secret RUHEPOL_KEYSTORE_B64 fehlt."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore

      - name: APK bauen
        # Nur für 64-Bit-Handys (wie das Galaxy S25) => deutlich kleinere APK
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: APK benennen
        run: cp build/app/outputs/flutter-apk/app-release.apk "agenda-build-${{ github.run_number }}.apk"

      # Die App fragt dieses Release ab (Mehr → App → Nach Updates suchen).
      # Der Commit-Text erscheint dort als „Neu:“.
      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agenda Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: agenda-build-${{ github.run_number }}.apk

      - name: Erzeugte Android-Dateien ins Repository übernehmen
        if: steps.bootstrap.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git add .metadata 2>/dev/null || true
          git commit -m "Android-Projektdateien erzeugt (flutter create)"
          git push
