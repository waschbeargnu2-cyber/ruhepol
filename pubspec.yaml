name: ruhepol
description: Agenda – To-Do-App mit Handy-Kalender, Erinnerungen, Pastellfarben und Material 3.
publish_to: 'none'

# Versionsnummer der App. Die Zahl hinter dem "+" setzt der Cloud-Build
# automatisch (fortlaufende Build-Nummer), damit Updates sich installieren lassen.
version: 0.5.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Deutsche Texte für Datums- und Uhrzeitauswahl
  flutter_localizations:
    sdk: flutter
  # Findet den privaten Speicherordner der App auf dem Handy
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
